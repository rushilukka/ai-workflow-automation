name: Send scheduled personalized Telegram message

on:
  schedule:
    # Runs every day at 7:00 PM IST (13:30 UTC).
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  send-telegram-message:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projects/scheduled-personalized-msg/cron-job-telegram

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate Telegram secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::Missing BOT_TOKEN repository secret"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "::error::Missing CHAT_ID repository secret"
            exit 1
          fi

      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: npm start
